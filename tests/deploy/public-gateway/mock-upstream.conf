log_format gateway_test '$request_method request=$request_uri host=$host '
                        'xfh=$http_x_forwarded_host xfp=$http_x_forwarded_proto '
                        'xfpfx=$http_x_forwarded_prefix forwarded=$http_forwarded '
                        'xff=$http_x_forwarded_for original=$http_x_original_url '
                        'rewrite=$http_x_rewrite_url xfport=$http_x_forwarded_port '
                        'xfssl=$http_x_forwarded_ssl realip=$http_x_real_ip';

access_log /dev/stdout gateway_test;

# ?with_security_headers=1 makes the origin send its own copies, which the gateway must replace.
map $arg_with_security_headers $mock_nosniff { default ''; 1 nosniff; }
map $arg_with_security_headers $mock_frame_options { default ''; 1 SAMEORIGIN; }
map $arg_with_security_headers $mock_referrer_policy { default ''; 1 no-referrer; }
map $arg_with_security_headers $mock_csp { default ''; 1 'default-src *'; }

server {
    listen 8080;
    server_name _;
    add_header X-Gateway-Test-Large $arg_large_header always;
    add_header X-Content-Type-Options $mock_nosniff always;
    add_header X-Frame-Options $mock_frame_options always;
    add_header Referrer-Policy $mock_referrer_policy always;
    add_header Content-Security-Policy $mock_csp always;

    location / {
        default_type text/plain;
        return 200 '$request_method request=$request_uri host=$host xfh=$http_x_forwarded_host xfp=$http_x_forwarded_proto xfpfx=$http_x_forwarded_prefix forwarded=$http_forwarded xff=$http_x_forwarded_for original=$http_x_original_url rewrite=$http_x_rewrite_url xfport=$http_x_forwarded_port xfssl=$http_x_forwarded_ssl realip=$http_x_real_ip\n';
    }
}
