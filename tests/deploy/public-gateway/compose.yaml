services:
    mock:
        image: nginx@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
        ports:
            - 127.0.0.1:19082:8080
        volumes:
            - ./mock-upstream.conf:/etc/nginx/conf.d/default.conf:ro

    gateway:
        image: nginx@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
        network_mode: host
        user: '101:101'
        command:
            - /bin/sh
            - -c
            - envsubst '$$GATEWAY_PORT $$UPSTREAM_HOST $$UPSTREAM_PORT' < /etc/nginx/nginx.conf.template > /tmp/nginx.conf && exec nginx -c /tmp/nginx.conf -g 'daemon off;'
        environment:
            GATEWAY_PORT: '18083'
            UPSTREAM_HOST: '127.0.0.1'
            UPSTREAM_PORT: '19082'
        volumes:
            - ../../../deploy/cloudflare/nginx.conf:/etc/nginx/nginx.conf.template:ro
        read_only: true
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        tmpfs:
            - /var/cache/nginx
            - /var/run
            - /tmp:mode=1777
