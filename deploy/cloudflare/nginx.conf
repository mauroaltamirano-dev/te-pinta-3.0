worker_processes 1;
pid /tmp/nginx.pid;

events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    # Cloudflare reports the visitor's scheme; plain HTTP pages cannot run the https:// module scripts.
    map $http_cf_visitor $plain_http_visitor {
        default 0;
        ~"scheme":"http"(?!s) 1;
    }

    map $request_uri $unsafe_request_path {
        default 0;
        ~^/[^?]*% 1;
        ~^/[^?]*// 1;
        ~^/[^?]*/\. 1;
    }

    server {
        listen 127.0.0.1:${GATEWAY_PORT};
        server_name _;
        server_tokens off;
        client_max_body_size 64k;

        # Browser hardening on every response, redirects and denials included. The storefront loads
        # only same-origin scripts, fonts, images and API calls; inline styles carry the brand palette.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        if ($plain_http_visitor) {
            return 301 https://tepinta.com.ar$request_uri;
        }

        if ($unsafe_request_path) {
            return 404;
        }

        location = / {
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
            try_files /__gateway_never_exists__ @public_origin;
        }

        location = /menu {
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
            try_files /__gateway_never_exists__ @public_origin;
        }

        location = /cart {
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
            try_files /__gateway_never_exists__ @public_origin;
        }

        location = /menu/catalog {
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
            try_files /__gateway_never_exists__ @public_origin;
        }

        location ~ ^/menu/[a-z0-9]+(?:-[a-z0-9]+)*$ {
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
            try_files /__gateway_never_exists__ @public_origin;
        }

        location = /checkout/options {
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
            try_files /__gateway_never_exists__ @public_origin;
        }

        location = /checkout/price-preview {
            if ($request_method != POST) { return 405; }
            try_files /__gateway_never_exists__ @public_origin;
        }

        location = /checkout/orders {
            if ($request_method != POST) { return 405; }
            try_files /__gateway_never_exists__ @public_origin;
        }

        location ~ ^/build/assets/[A-Za-z0-9][A-Za-z0-9._-]*\.(?:css|js|woff|woff2)$ {
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
            try_files /__gateway_never_exists__ @public_origin;
        }

        location ~ ^/images/brand/(?:hero|bg-empanada|logo-completo-blanco|logo-blanco)\.png$ {
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
            try_files /__gateway_never_exists__ @public_origin;
        }

        location ~ ^/icons/(?:te-pinta-logo\.svg|te-pinta-logo-192\.png)$ {
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
            try_files /__gateway_never_exists__ @public_origin;
        }

        location ~ ^/storage/products/[A-Za-z0-9][A-Za-z0-9_-]*\.(?:jpg|jpeg|png|webp)$ {
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
            try_files /__gateway_never_exists__ @public_origin;
        }

        location / {
            return 404;
        }

        location @public_origin {
            proxy_http_version 1.1;
            # The gateway owns these headers; drop origin copies so each is sent once.
            proxy_hide_header Strict-Transport-Security;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Referrer-Policy;
            proxy_buffer_size 16k;
            proxy_busy_buffers_size 16k;
            proxy_set_header Host tepinta.com.ar;
            proxy_set_header X-Forwarded-Host tepinta.com.ar;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Forwarded-Ssl '';
            proxy_set_header X-Forwarded-Prefix '';
            proxy_set_header Forwarded '';
            proxy_set_header X-Original-URL '';
            proxy_set_header X-Rewrite-URL '';
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_pass http://${UPSTREAM_HOST}:${UPSTREAM_PORT};
        }
    }
}
