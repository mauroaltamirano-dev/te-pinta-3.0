services:
    public-app:
        build:
            context: ../../..
            dockerfile: deploy/cloudflare/public-app/Dockerfile
            args:
                PRODUCT_RESOURCE_SHA256: 1fdb088e06bb6b58f8fcabb5e980dcc91fb951e1048baaac30333e1a04f90ce8
                FEATURED_VIEW_SHA256: 0d34ea4ed8e9499bed525cc6c4d8b5842a03058a620ee3b76accb74cc233d46e
                HELPER_SHA256: 7d048d7505ea16676351e859c2386f13d39b4bab738583df8f67f129e090e9b5
        image: tepinta3-public-app:local
        env_file:
            - ${PUBLIC_APP_ENV_FILE:-../../tailscale/.env}
        ports:
            - 127.0.0.1:8084:80
        volumes:
            - ../../../storage/app/public:/var/www/html/storage/app/public:ro
            - public-app-logs:/var/www/html/storage/logs
        networks:
            - database

networks:
    database:
        external: true
        name: ${DATABASE_DOCKER_NETWORK:-tepinta30_sail}

volumes:
    public-app-logs:
