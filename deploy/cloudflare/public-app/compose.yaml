services:
    public-app:
        image: ${PUBLIC_APP_IMAGE:-tepinta3-public-app:release-9a4dac2}
        pull_policy: never
        restart: unless-stopped
        env_file:
            - ${PUBLIC_APP_ENV_FILE:-../../tailscale/.env}
        ports:
            - 127.0.0.1:${PUBLIC_APP_PORT:-8084}:80
        volumes:
            - ${APP_STORAGE_ROOT:-../../../storage}/app/public:/var/www/html/storage/app/public:ro
            - public-app-logs:/var/www/html/storage/logs
        networks:
            - database

networks:
    database:
        external: true
        name: ${DATABASE_DOCKER_NETWORK:-tepinta30_sail}

volumes:
    public-app-logs:
