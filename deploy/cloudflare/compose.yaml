services:
    gateway:
        image: nginx@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
        network_mode: host
        user: '101:101'
        command:
            - /bin/sh
            - -c
            - envsubst '$$GATEWAY_PORT $$UPSTREAM_HOST $$UPSTREAM_PORT' < /etc/nginx/nginx.conf.template > /tmp/nginx.conf && exec nginx -c /tmp/nginx.conf -g 'daemon off;'
        environment:
            GATEWAY_PORT: '${GATEWAY_PORT:-8083}'
            UPSTREAM_HOST: '127.0.0.1'
            UPSTREAM_PORT: '${PUBLIC_APP_PORT:-8084}'
        volumes:
            # Relative to this file: deploy/release.sh runs it from ~/tepinta-releases/<sha>.
            - ./nginx.conf:/etc/nginx/nginx.conf.template:ro
        read_only: true
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        tmpfs:
            - /var/cache/nginx
            - /var/run
            - /tmp:mode=1777
        restart: unless-stopped
