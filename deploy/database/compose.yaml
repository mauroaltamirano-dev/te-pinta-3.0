# Production PostgreSQL, owned by deploy instead of the development Sail stack.
# It uses a volume copied from the Sail one during the cutover (never shared
# with it) and lives on its own network, so neither
# `sail down` nor a changed development compose file can stop or recreate it.
# Started only during the cutover (deploy/cutover/README.md).
services:
    postgres:
        image: postgres:18-alpine
        restart: unless-stopped
        environment:
            # Role used by backup and import scripts (`-U "$POSTGRES_USER"`); the
            # existing data directory keeps its own roles and passwords.
            POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER to the existing database superuser}
        volumes:
            - data:/var/lib/postgresql
        networks:
            production:
                aliases:
                    - tepinta-db
        healthcheck:
            test: [CMD, pg_isready, -q]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 20s

volumes:
    data:
        external: true
        name: ${DATABASE_VOLUME:-tepinta-production-pgsql}

networks:
    production:
        external: true
        name: ${DATABASE_DOCKER_NETWORK:-tepinta-production}
