services:
    app:
        build:
            context: ../..
            dockerfile: deploy/tailscale/Dockerfile
            args:
                SAIL_IMAGE: ${SAIL_IMAGE:-sail-8.5/app}
        image: ${APP_IMAGE:-tepinta3-operational:local}
        restart: unless-stopped
        env_file:
            - ${RUNTIME_ENV_FILE:-.env}
        ports:
            - 127.0.0.1:${APP_PORT:-8082}:80
        extra_hosts:
            - host.docker.internal:host-gateway
        volumes:
            - ${APP_STORAGE_ROOT:-../../storage}/app/public:/var/www/html/storage/app/public
            - ${APP_STORAGE_ROOT:-../../storage}/app/private/instagram:/var/www/html/storage/app/private/instagram
            - ${APP_STORAGE_ROOT:-../../storage}/app/private/management:/var/www/html/storage/app/private/management
            - operational-logs:/var/www/html/storage/logs
        networks:
            database:
                aliases:
                    # n8n calls the app by this name; staging must use another one.
                    - ${OPERATIONAL_ALIAS:-tepinta-operational}
        healthcheck:
            test: [CMD, curl, --fail, --silent, http://127.0.0.1/up]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 20s

    scheduler:
        image: ${APP_IMAGE:-tepinta3-operational:local}
        restart: unless-stopped
        entrypoint: []
        user: '1337:1000'
        env_file:
            - ${RUNTIME_ENV_FILE:-.env}
        command: ["/bin/bash", "-lc", "umask 0007; exec php artisan schedule:work"]
        extra_hosts:
            - host.docker.internal:host-gateway
        volumes:
            - ${APP_STORAGE_ROOT:-../../storage}/app/public:/var/www/html/storage/app/public
            - ${APP_STORAGE_ROOT:-../../storage}/app/private/instagram:/var/www/html/storage/app/private/instagram
            - ${APP_STORAGE_ROOT:-../../storage}/app/private/management:/var/www/html/storage/app/private/management
            - operational-logs:/var/www/html/storage/logs
        networks:
            - database
        healthcheck:
            test: [CMD-SHELL, "ps -eo args | grep -q '[a]rtisan schedule:work'"]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 15s

networks:
    database:
        external: true
        name: ${DATABASE_DOCKER_NETWORK:-tepinta30_sail}

volumes:
    operational-logs:
