services:
    app:
        build:
            context: ../..
            dockerfile: deploy/tailscale/Dockerfile
            args:
                SAIL_IMAGE: ${SAIL_IMAGE:-sail-8.5/app}
        image: ${APP_IMAGE:-tepinta3-operational:local}
        restart: unless-stopped
        env_file:
            - ${RUNTIME_ENV_FILE:-.env}
        ports:
            - 127.0.0.1:${APP_PORT:-8082}:80
        extra_hosts:
            - host.docker.internal:host-gateway
        volumes:
            - ../../storage/app/public:/var/www/html/storage/app/public
            - operational-logs:/var/www/html/storage/logs
        networks:
            - database
        healthcheck:
            test: [CMD, curl, --fail, --silent, http://127.0.0.1/up]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 20s

networks:
    database:
        external: true
        name: ${DATABASE_DOCKER_NETWORK:-tepinta30_sail}

volumes:
    operational-logs:
