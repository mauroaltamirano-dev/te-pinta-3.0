; Production PHP hardening, loaded after the Sail defaults (99-sail.ini).
;
; CVE-2026-109619 (GHSA-6wmf-4rv5-p3rp): persistent workers can reuse state freed
; by an earlier request. Session upload progress is a confirmed consumer and
; fatal error backtraces a confirmed producer on PHP 8.5. The application uses
; neither. Upgrading to PHP 8.5.12 is the only complete fix; keep upload
; progress disabled afterwards because nothing needs it.
session.upload_progress.enabled = 0
fatal_error_backtraces = 0

; The largest accepted upload is a 10 MB management attachment; the extra
; post_max_size room covers multipart overhead and the other form fields.
upload_max_filesize = 10M
post_max_size = 12M
